<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>PocketSQL export spike</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; color: #1c1c1c; background: #fafafa; }
      pre { white-space: pre-wrap; background: #fff; border: 1px solid #ddd; padding: 0.75rem; border-radius: 6px; }
      progress { width: 100%; }
      button { font: inherit; padding: 0.4rem 0.9rem; }
      @media (prefers-color-scheme: dark) { body { color: #eee; background: #161616; } pre { background: #222; border-color: #444; } }
    </style>
  </head>
  <body>
    <h1>PocketSQL export spike</h1>
    <p>
      Loads the re-exported base model (unmodified Qwen3-0.6B) with Transformers.js and writes
      SQL for three questions about the Chinook music store. Add <code>?device=wasm</code> to test the
      slower fallback.
    </p>
    <p id="env"></p>
    <progress id="progress" max="1" value="0"></progress>
    <p id="status">Starting…</p>
    <div id="results"></div>
    <p><button id="copy" type="button" disabled>Copy report</button></p>
    <script type="module" src="/src/spike.ts"></script>
  </body>
</html>
