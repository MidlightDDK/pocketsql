[project]
name = "pocketsql"
version = "0.0.0"
description = "Data, training, export, eval, and release pipeline for PocketSQL."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "huggingface-hub==1.33.0",
    "jinja2==3.1.6",
    "sqlglot==30.19.0",
    "transformers==5.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
# PyTorch zero-shot baselines on CPU (the Windows PyPI wheel is CPU-only); not synced in CI.
infer = [
    "torch==2.14.0",
]
# ONNX export with the ONNX Runtime GenAI model builder (how onnx-community built
# Qwen3-0.6B-ONNX); onnxruntime matches onnxruntime-node in Transformers.js 4.3.0.
export = [
    "onnx==1.23.0",
    "onnx-ir==1.0.0",
    "onnxruntime==1.30.0",
    "onnxruntime-genai==0.17.0",
    "torch==2.14.0",
]
# LoRA SFT (pocketsql.train). Kaggle keeps its image's CUDA torch; kaggle/train/train.py
# pins the rest to these versions. Unsloth 2026.9.11 needs transformers<=5.5, trl<=0.24.
train = [
    "accelerate==1.15.0",
    "datasets==5.0.1",
    "peft==0.21.0",
    "pyyaml==6.0.3",
    "torch==2.14.0",
    "trl==1.14.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
